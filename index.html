    saveFlaskEdit: function (el) {
      var f = Object.assign({}, B.byId(S.data, 'flasks', el.dataset.f), { name: SS.st.name, passage: SS.st.passage, status: SS.st.status, vessel: SS.st.vessel, condition: (SS.st.condition || '').trim() });
      B.upsert(S.data, 'flasks', f); save(); closeSheet(); render();
    },
    delLog: function (el) { if (!confirm('Delete this entry?')) return; B.remove(S.data, 'logs', el.dataset.l); save(); refreshSheet(); render(); },
    delFlask: function (el) {
      if (!confirm('Delete this flask and all its history?')) return;
      var id = el.dataset.f; S.data.logs.filter(function (l) { return l.flaskId === id; }).forEach(function (l) { B.remove(S.data, 'logs', l.id); });
      B.remove(S.data, 'flasks', id); save(); closeSheet(); render();
    },
    toggleInactive: function () { S.ui.showInactive = !S.ui.showInactive; render(); },
    newExp: function () { newExpSheet(); },
    fixWeekend: function () {
      var p = B.byId(S.data, 'protocols', SS.st.protocolId);
      var s = B.weekendFreeStart(S.data, p, SS.st.start < B.todayISO() ? B.todayISO() : SS.st.start, 21);
      if (s) { SS.st.start = s; refreshSheet(); toast('Moved start to ' + B.fmtDate(s)); } else toast('No clean start in the next 3 weeks');
    },
    createExp: createExp,
    openExp: function (el) { expSheet(el.dataset.e); },
    toggleStep: function (el) {
      var e = B.byId(S.data, 'experiments', el.dataset.e), s = e.steps.find(function (x) { return x.id === el.dataset.s; });
      s.done = !s.done; s.doneAt = s.done ? new Date().toISOString() : null;
      var before = e.status; e.status = B.autoStatus(e); B.upsert(S.data, 'experiments', e); save();
      if (SS && SS.st.status !== undefined && SS.st.notes !== undefined) SS.st.status = e.status;
      if (SS) refreshSheet(); render();
      if (e.status === 'Done' && before !== 'Done' && !SS) { toast('All steps done. Log the result.'); expSheet(e.id); }
    },
    moveToday: function (el) {
      var e = B.byId(S.data, 'experiments', el.dataset.e), s = e.steps.find(function (x) { return x.id === el.dataset.s; });
      B.shiftSteps(e, s.id, B.diffDays(s.date, B.todayISO())); B.upsert(S.data, 'experiments', e); save(); render(); toast('Moved, later steps shifted too');
    },
    shift: function (el) {
      var e = B.byId(S.data, 'experiments', el.dataset.e);
      B.shiftSteps(e, el.dataset.s, +el.dataset.v); B.upsert(S.data, 'experiments', e); save(); refreshSheet(); render();
    },
    saveExp: function (el) {
      var e = B.byId(S.data, 'experiments', el.dataset.e), st = SS.st;
      Object.assign(e, { status: st.status, result: st.result, title: st.title, target: st.target, treatment: st.treatment, notes: st.notes });
      B.upsert(S.data, 'experiments', e); save(); closeSheet(); render(); toast('Saved');
    },
    delExp: function (el) { if (!confirm('Delete this experiment?')) return; B.remove(S.data, 'experiments', el.dataset.e); save(); closeSheet(); render(); },
    expFilter: function (el) { S.ui.expFilter = el.dataset.v; render(); },
    newTask: function () { taskSheet(); },
    editTask: function (el) { taskSheet(el.dataset.t); },
    saveTask: function (el) {
      var st = SS.st; if (!st.title.trim()) { toast('Type a task'); return; }
      var t = el.dataset.t ? B.byId(S.data, 'tasks', el.dataset.t) : { id: B.uid('tk'), done: false, notes: '' };
      Object.assign(t, { title: st.title.trim(), date: st.date || null, category: st.category, priority: st.priority });
      B.upsert(S.data, 'tasks', t); save(); closeSheet(); render(); toast('Task saved');
    },
    toggleTask: function (el) { var t = B.byId(S.data, 'tasks', el.dataset.t); t.done = !t.done; B.upsert(S.data, 'tasks', t); save(); if (SS) refreshSheet(); render(); },
    delTask: function (el) { B.remove(S.data, 'tasks', el.dataset.t); save(); closeSheet(); render(); },
    tasksSheet: tasksSheet,
    newNote: noteSheet, notesSheet: notesSheet,
    saveNote: function () { var t = (SS.st.text || '').trim(); if (!t) { toast('Empty note'); return; } B.upsert(S.data, 'notes', { id: B.uid('nt'), ts: new Date().toISOString(), text: t }); save(); closeSheet(); render(); toast('Note saved'); },
    delNote: function (el) { B.remove(S.data, 'notes', el.dataset.n); save(); refreshSheet(); },
    protocolsSheet: protocolsSheet,
    editProtocol: function (el) { editProtocolSheet(el.dataset.p); },
    addStep: function () { var last = SS.st.steps[SS.st.steps.length - 1]; SS.st.steps.push({ name: '', day: last ? last.day + 1 : 0 }); refreshSheet(); },
    rmStep: function (el) { SS.st.steps.splice(+el.dataset.v, 1); refreshSheet(); },
    saveProtocol: function (el) {
      var st = SS.st; if (!st.name.trim()) { toast('Name it'); return; }
      var steps = st.steps.filter(function (s) { return s.name.trim(); }).map(function (s) { return { name: s.name.trim(), day: Math.max(0, parseInt(s.day, 10) || 0) }; }).sort(function (a, b) { return a.day - b.day; });
      if (!steps.length) { toast('Add at least one step'); return; }
      var p = el.dataset.p ? B.byId(S.data, 'protocols', el.dataset.p) : { id: B.uid('pr') };
      Object.assign(p, { name: st.name.trim(), color: st.color, steps: steps });
      B.upsert(S.data, 'protocols', p); markSetting('protocolsReviewed'); save(); protocolsSheet(); toast('Template saved');
    },
    delProtocol: function (el) { if (!confirm('Delete this template? Planned experiments stay.')) return; B.remove(S.data, 'protocols', el.dataset.p); save(); protocolsSheet(); },
    linesSheet: linesSheet,
    protocolsOk: function () { markSetting('protocolsReviewed'); save(); closeSheet(); render(); toast('Marked as checked'); },
    addLine: function () { SS.st.lines.push({ id: B.uid('cl'), name: '', doublingHours: 24, media: '' }); refreshSheet(); },
    rmLine: function (el) { SS.st.lines.splice(+el.dataset.v, 1); refreshSheet(); },
    saveLines: function () {
      var keep = {};
      SS.st.lines.filter(function (c) { return c.name.trim(); }).forEach(function (c) {
        keep[c.id] = 1; var old = B.byId(S.data, 'cellLines', c.id);
        if (!old || JSON.stringify([old.name, old.doublingHours, old.media]) !== JSON.stringify([c.name, c.doublingHours, c.media]))
          B.upsert(S.data, 'cellLines', { id: c.id, name: c.name.trim(), doublingHours: +c.doublingHours || 24, media: c.media });
      });
      S.data.cellLines.slice().forEach(function (c) { if (!keep[c.id]) B.remove(S.data, 'cellLines', c.id); });
      markSetting('linesReviewed'); save(); closeSheet(); render(); toast('Saved');
    },
    settingsSheet: settingsSheet,
    saveSettings: function () { S.data.settings = Object.assign({}, S.data.settings, SS.st, { updatedAt: new Date().toISOString() }); save(); closeSheet(); render(); },
    syncSheet: syncSheet,
    saveGh: function () {
      var st = SS.st; if (!st.owner || !st.repo || !st.token) { toast('Fill in username, repo and token'); return; }
      S.gh = { owner: st.owner.trim(), repo: st.repo.trim(), token: st.token.trim(), branch: (st.branch || 'main').trim(), path: (st.path || 'benchlog.json').trim() };
      lsSet(KEY_GH, S.gh); setSync('busy', 'Connecting…');
      ensureAgentsFile().then(function () { return syncNow(true); }).then(function () {
        if (S.sync.state === 'ok') { toast('Connected'); closeSheet(); render(); } else refreshSheet();
      }, function (e) { setSync('err', /404/.test(e.message) ? 'Repo not found' : /401|403/.test(e.message) ? 'Token problem' : 'Could not connect'); refreshSheet(); });
    },
    syncForce: function () { syncNow(true).then(refreshSheet); },
    disconnect: function () { if (!confirm('Stop syncing on this device? Your data stays here and in the repo.')) return; S.gh = null; try { localStorage.removeItem(KEY_GH); } catch (e) {} setSync('off', 'Local only'); closeSheet(); render(); },
    aiSheet: aiSheet,
    copyAi: function () { copyText(B.summaryMarkdown(S.data) + '\n\n---\nData schema (for reference):\n' + B.AGENTS_MD); },
    backupSheet: backupSheet,
    calcSheet: function () { calcSheet(null); },
    calcForExp: function (el) {
      var e = B.byId(S.data, 'experiments', el.dataset.e), st = SS.st;
      Object.assign(e, { status: st.status, result: st.result, title: st.title, target: st.target, treatment: st.treatment, notes: st.notes });
      B.upsert(S.data, 'experiments', e); save(); calcSheet(e.id);
    },
    calcBack: function () { var id = calcCtx && calcCtx.expId; calcCtx = null; if (id) expSheet(id); else closeSheet(); },
    reportSheet: function () { reportSheet(); },
    papersSheet: papersSheet, pastePaper: pastePaperSheet, newPaper: function () { paperSheet(null); },
    openPaper: function (el) { paperSheet(el.dataset.p); },
    copyLibrary: function () { copyText(B.libraryMarkdown(S.data, SS && SS.st.q)); },
    copyCard: function (el) { copyText(B.formatPaperCard(B.byId(S.data, 'papers', el.dataset.p))); },
    savePasted: function () {
      var cards = B.parsePaperCards(SS.st.text); if (!cards.length) { toast('No PAPER CARD found'); return; }
      var upd = 0; cards.forEach(function (c) { if (B.savePaperCard(S.data, c).updated) upd++; });
      save(); render(); papersSheet(); toast('Saved ' + cards.length + ' card' + (cards.length > 1 ? 's' : '') + (upd ? ' (' + upd + ' updated)' : ''));
    },
    savePaper: function (el) {
      var st = SS.st, card = { readOn: st.readOn };
      B.PAPER_FIELDS.forEach(function (f) { card[f[0]] = (st[f[0]] || '').trim(); });
      if (!card.citation && !card.claim) { toast('Add at least a citation'); return; }
      card.tags = card.tags ? card.tags.split(/[,;]/).map(function (t) { return t.trim().replace(/^#/, ''); }).filter(Boolean) : [];
      card.year = card.year ? +card.year || null : null;
      var p = el.dataset.p ? Object.assign({}, B.byId(S.data, 'papers', el.dataset.p), card) : Object.assign({ id: B.uid('pp') }, card);
      B.upsert(S.data, 'papers', p); save(); render(); papersSheet(); toast('Card saved');
    },
    delPaper: function (el) { if (!confirm('Delete this paper card?')) return; B.remove(S.data, 'papers', el.dataset.p); save(); render(); papersSheet(); },
    rptSec: function (el) { SS.st.sections[el.dataset.v] = !SS.st.sections[el.dataset.v]; refreshSheet(); },
    rptPreview: function () { reportPreview(SS.st); },
    rptBack: function () { reportSheet(SS.st); },
    rptDocx: function () {
      var r = reportFromState(SS.st); if (!r) return; saveReportMeta(SS.st);
      download(R.fileBase(r) + '.docx', R.toDocx(r), 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
    },
    rptMd: function () { var r = reportFromState(SS.st); if (!r) return; saveReportMeta(SS.st); download(R.fileBase(r) + '.md', R.toMarkdown(r), 'text/markdown'); },
    rptCopy: function () { var r = reportFromState(SS.st); if (!r) return; copyText(R.toMarkdown(r)); },
    rptPdf: function () {
      var r = reportFromState(SS.st); if (!r) return; saveReportMeta(SS.st);
      var root = document.getElementById('print-root');
      if (!root) { root = document.createElement('div'); root.id = 'print-root'; document.body.appendChild(root); }
      root.innerHTML = R.toHTML(r);
      var prev = document.title; document.title = R.fileBase(r);
      setTimeout(function () { try { window.print(); } catch (e) { toast('Printing is not available here'); } document.title = prev; }, 50);
    },
    csv: function (el) { exportCsv(el.dataset.v); },
    ics: exportIcs,
    setupDone: function () { markSetting('setupDone'); save(); render(); },
    backup: function () { S.meta.backupAt = new Date().toISOString(); lsSet(KEY_META, S.meta); download('benchmate-backup-' + B.todayISO() + '.json', JSON.stringify(S.data, null, 1), 'application/json'); },
    wipe: function () {
      if (!confirm('Erase everything on this device? If sync is on, the repo copy remains and will come back on next sync.')) return;
      S.data = B.defaultData(); save({ noSync: true }); closeSheet(); render(); toast('Erased');
    }
  };
  var CHANGE = {
    restore: function (el) {
      var file = el.files[0]; if (!file) return;
      file.text().then(function (txt) {
        var inc = B.normalize(JSON.parse(txt));
        S.data = B.normalize(B.merge(S.data, inc)); save(); closeSheet(); render(); toast('Backup merged');
      }).catch(function () { toast('Not a BenchMate backup'); });
    }
  };

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-a]'); if (!el) return;
    var fn = A[el.dataset.a]; if (!fn) return;
    ev.preventDefault(); ev.stopPropagation(); fn(el, ev);
  });
  document.addEventListener('input', function (ev) {
    var el = ev.target;
    if (el.dataset.bind && SS) SS.st[el.dataset.bind] = el.value;
    if (el.dataset.refreshInput && SS) { var pc = document.getElementById('pasteCount'); if (pc) { var cs = B.parsePaperCards(el.value); pc.textContent = cs.length ? 'Found ' + cs.length + ' card' + (cs.length > 1 ? 's' : '') + ': ' + cs.map(function (c) { return (c.citation || c.claim || '').slice(0, 60) + (B.matchPaper(S.data, c) ? ' (updates existing)' : ''); }).join('; ') : 'No card found yet.'; } }
    if (el.dataset.step != null && SS) SS.st.steps[+el.dataset.step][el.dataset.field] = el.value;
    if (el.dataset.line != null && SS) SS.st.lines[+el.dataset.line][el.dataset.field] = el.value;
    if (el.dataset.ui) { S.ui[el.dataset.ui] = el.value; clearTimeout(A._t); A._t = setTimeout(function () { var pos = el.selectionStart; render(); var n = document.querySelector('[data-ui="' + el.dataset.ui + '"]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } }, 250); }
  });
  document.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.dataset.refresh && SS) { SS.st[el.dataset.bind] = el.value; refreshSheet(); }
    if (el.dataset.aChange && CHANGE[el.dataset.aChange]) CHANGE[el.dataset.aChange](el);
  });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') { render(); syncNow(); } });
  window.addEventListener('online', function () { syncNow(); });
  setInterval(function () { if (document.visibilityState === 'visible') syncNow(); }, 5 * 60000);
  // Re-render at midnight so "Today" stays correct.
  var dayNow = B.todayISO(); setInterval(function () { if (B.todayISO() !== dayNow) { dayNow = B.todayISO(); if (!SS) render(); } }, 60000);

  if (S.gh) setSync('busy', 'Syncing…');
  render();
  syncNow();
  try { if ('serviceWorker' in navigator && location.protocol === 'https:' && window.self === window.top) navigator.serviceWorker.register('sw.js'); } catch (e) {}
  window.BenchMate = { state: S, sync: syncNow };
})();

</script>
</body>
</html>
